name: Release Published

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get current time
        id: current-time
        run: echo "formattedTime=$(TZ='Asia/Shanghai' date '+%Y%m%d-%H')" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-zip-perl
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: rm -f app/keystore.jks && ./gradlew clean && ./gradlew ":app:assembleRelease" -Pxposed=true
        env:
          BUILD_RELEASE_MINIFYENABLED: ${{ vars.BUILD_RELEASE_MINIFYENABLED }}
      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} app/build/outputs/apk/release/*.apk --repo ${{ github.repository }}
