apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {

    compileSdk 36
    defaultConfig {
        applicationId "com.surcumference.fingerprintpay"
        minSdk 31
        targetSdk 36
        versionCode 40
        versionName "7.5.1"
        buildConfigField "String", "APP_PRODUCT_NAME", "\"FingerprintPay\""
    }

    buildTypes {
        release {
            minifyEnabled System.getenv("BUILD_RELEASE_MINIFYENABLED")?.toBoolean() ?: true
            shrinkResources System.getenv("BUILD_RELEASE_MINIFYENABLED")?.toBoolean() ?: true
            zipAlignEnabled true
            proguardFiles 'proguard-rules.pro', 'r8-rules.pro'
            javaMaxHeapSize "4g"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    repositories{
        flatDir{
            dirs 'libs'
        }
    }

    packagingOptions {
        exclude '**/publicsuffixes.gz'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }

    //https://proandroiddev.com/how-to-securely-build-and-sign-your-android-app-with-github-actions-ad5323452ce#fromHistory
    def keystoreFile = file('keystore.jks')
    namespace 'com.surcumference.fingerprint'
    if (keystoreFile.exists()) {
        signingConfigs {
            release {
                storeFile = keystoreFile
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }
}
project.ext.appInfo = [
    Alipay:     "com.eg.android.AlipayGphone",
    WeChat:     "com.tencent.mm",
]

apply from: 'debug.gradle'

dependencies {
    implementation 'com.google.code.gson:gson:2.8.6'
    // Using platform android.hardware.biometrics.BiometricPrompt (API 31+)
    implementation 'com.squareup.okhttp3:okhttp:3.12.8'
    implementation 'com.umeng.analytics:analytics:6.1.2'
    implementation 'com.crossbowffs.remotepreferences:remotepreferences:0.5'
    implementation 'com.lzy.net:okgo:3.0.4'
    implementation 'com.github.getActivity:Toaster:12.6'
    compileOnly 'io.github.libxposed:api:101.0.1'

    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.interpolator:interpolator:1.0.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}